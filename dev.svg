    <!-- 核心：动态布局脚本 -->
    <script type="text/javascript">
        <![CDATA[
            document.addEventListener("DOMContentLoaded", () => {
            const startX = 50;       // 初始 X 坐标
            const startY = 50;       // 初始 Y 坐标
            const imgWidth = 800;    // 图片宽度
            const gapX = 50;         // 横向间距 (900 - 800 - 50 = 50)
            const rowHeight = 1250;  // 每行的高度间距 (1250 - 50)
            const cols = 4;          // 每行最多 4 张图

            const images = document.querySelectorAll("#imageGrid image");
            
            images.forEach((img, index) => {
                // 计算当前图片在哪一列、哪一行
                const col = index % cols;
                const row = Math.floor(index / cols);

                // 动态计算坐标
                const posX = startX + col * (imgWidth + gapX);
                const posY = startY + row * rowHeight;

                // 动态赋值给图片
                img.setAttribute("x", posX);
                img.setAttribute("y", posY);
                img.setAttribute("width", imgWidth);
            });

            // 甚至可以根据图片数量动态调整 SVG 的总体高度
            const totalRows = Math.ceil(images.length / cols);
            const finalHeight = startY + totalRows * rowHeight;
            document.getElementById("dev-image-svg").setAttribute("viewBox", `0 0 3450 ${finalHeight}`);
            });
    ]]>
    </script>
</svg>